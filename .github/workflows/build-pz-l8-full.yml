name: Build PZ-L8 full firmware (NSS + tproxy)

# 基于 mufeng05 NSS 源码树全量编译 PZ-L8 固件，开启 nft-tproxy / nft-socket 内核模块，
# 使 PassWall2 透明代理（TCP redirect + UDP tproxy）完整可用。
# 触发方式：GitHub Actions 页面手动 Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout mufeng05 pzl8-nss repo
        uses: actions/checkout@v4
        with:
          repository: mufeng05/openwrt-cmcc-pz-l8-nss
          path: pzl8-nss

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd libelf-dev \
            u-boot-tools device-tree-compiler
          sudo timedatectl set-timezone Asia/Shanghai || true

      - name: Checkout OpenWrt v25.12.5
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5
          path: openwrt
          fetch-depth: 0

      - name: Prepare the tree (mufeng05 NSS setup.sh)
        run: |
          pzl8-nss/scripts/setup.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Add SONiC fullcone NAT
        env:
          FULLCONE_REPO: https://github.com/mufeng05/openwrt-sonic-fullcone
        run: |
          set -euo pipefail
          git clone --depth 1 "$FULLCONE_REPO" fullcone
          ( cd openwrt && bash "$GITHUB_WORKSPACE/fullcone/add_sonic_fullcone.sh" ) | \
              tee "$RUNNER_TEMP/fullcone.log"
          grep -q '=== Done: [0-9]* applied, 0 skipped ===' "$RUNNER_TEMP/fullcone.log" || \
              { echo "::error::add_sonic_fullcone.sh skipped something"; exit 1; }

      - name: Add the Argon theme
        run: |
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git \
            openwrt/package/luci-theme-argon
          cd openwrt
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          make defconfig

      - name: Enable NFT_TPROXY / NFT_SOCKET kernel config
        run: |
          cd openwrt
          CFG=target/linux/qualcommax/ipq50xx/config-6.12
          grep -q '^CONFIG_NFT_TPROXY=m' "$CFG" || echo 'CONFIG_NFT_TPROXY=m' >> "$CFG"
          grep -q '^CONFIG_NFT_SOCKET=m' "$CFG" || echo 'CONFIG_NFT_SOCKET=m' >> "$CFG"
          grep -q '^CONFIG_NF_TPROXY_IPV4=m' "$CFG" || echo 'CONFIG_NF_TPROXY_IPV4=m' >> "$CFG"
          grep -q '^CONFIG_NF_TPROXY_IPV6=m' "$CFG" || echo 'CONFIG_NF_TPROXY_IPV6=m' >> "$CFG"
          grep -q '^CONFIG_NF_SOCKET_IPV4=m' "$CFG" || echo 'CONFIG_NF_SOCKET_IPV4=m' >> "$CFG"
          grep -q '^CONFIG_NF_SOCKET_IPV6=m' "$CFG" || echo 'CONFIG_NF_SOCKET_IPV6=m' >> "$CFG"
          make defconfig
          echo "=== kernel config check ==="
          grep -E 'CONFIG_NFT_TPROXY|CONFIG_NFT_SOCKET|CONFIG_NF_TPROXY_IPV|CONFIG_NF_SOCKET_IPV' .config || true

      - name: Patch default LAN IP (avoid collision with main router 192.168.10.x)
        run: |
          cd openwrt
          UD=target/linux/qualcommax/ipq50xx/base-files/etc/uci-defaults
          mkdir -p "$UD"
          printf '%s\n' '#!/bin/sh' '# PZ-L8: avoid main router 192.168.10.x collision' \
            "uci set network.lan.ipaddr='192.168.11.1'" \
            "uci set network.lan.netmask='255.255.255.0'" \
            'uci commit network' 'exit 0' > "$UD/99-pz-l8-lan-ip"
          chmod +x "$UD/99-pz-l8-lan-ip"
          echo "=== uci-defaults ==="
          ls -la "$UD/"

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | grep -iE '^(Downloading|ERROR|.*failed)' || true
          find dl -size -1024c -type f -print -delete || true

      - name: Build firmware
        id: build
        run: |
          cd openwrt
          make -j$(nproc) || {
            echo "::warning::parallel build failed, retrying single-threaded"
            make -j1 V=s
          }

      - name: List what was produced
        if: success()
        run: |
          ls -lh "$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx/"
          cat "$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx/"*.manifest | head -40

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pz-l8-full-firmware-tproxy
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.bin
            openwrt/bin/targets/qualcommax/ipq50xx/*.ubi
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          retention-days: 14
